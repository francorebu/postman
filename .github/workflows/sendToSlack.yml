name: sendToSlack

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  run-postman:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman Collection
        continue-on-error: true
        run: |
          START_TIME=$(date +%s)

          newman run collections/RestCollection.postman_collection.json \
            --reporters cli,json \
            --reporter-json-export results.json

          END_TIME=$(date +%s)

          echo "DURATION=$((END_TIME - START_TIME))" >> $GITHUB_ENV

      - name: Extract Newman Results
        if: always()
        run: |
          echo "REQUESTS=$(jq '.run.stats.requests.total' results.json)" >> $GITHUB_ENV
          echo "FAILED_REQUESTS=$(jq '.run.stats.requests.failed' results.json)" >> $GITHUB_ENV

          echo "ASSERTIONS=$(jq '.run.stats.assertions.total' results.json)" >> $GITHUB_ENV
          echo "FAILED_ASSERTIONS=$(jq '.run.stats.assertions.failed' results.json)" >> $GITHUB_ENV

      - name: Send Slack Notification
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          PASSED_REQUESTS=$((REQUESTS - FAILED_REQUESTS))
          PASSED_ASSERTIONS=$((ASSERTIONS - FAILED_ASSERTIONS))

          if [ "$FAILED_REQUESTS" -gt 0 ] || [ "$FAILED_ASSERTIONS" -gt 0 ]; then
            STATUS="🔴"
            RESULT="FAILED"
          else
            STATUS="🟢"
            RESULT="PASSED"
          fi

          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RUN_LINK="<${RUN_URL}|View Run>"

          MESSAGE="${STATUS} API Tests ${RESULT} | 📨 ${REQUESTS} Requests | ✅ ${PASSED_REQUESTS} Req Passed | 🚨 ${FAILED_REQUESTS} Req Failed | ✅ ${PASSED_ASSERTIONS} Assert Passed | ❌ ${FAILED_ASSERTIONS} Assert Failed | ⏱️ ${DURATION}s | 🔗 ${RUN_LINK}"

          jq -n \
            --arg text "$MESSAGE" \
            '{text: $text}' > payload.json

          curl -X POST \
            -H "Content-type: application/json" \
            --data @payload.json \
            "$SLACK_WEBHOOK_URL"
