name: sendToSlack

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  run-postman:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman collection
        continue-on-error: true
        run: |
          newman run collections/RestCollection.postman_collection.json \
            --reporters cli,json \
            --reporter-json-export results.json

      - name: Extract Newman results
        if: always()
        run: |
          echo "REQUESTS=$(jq '.run.stats.requests.total' results.json)" >> $GITHUB_ENV
          echo "FAILED_REQUESTS=$(jq '.run.stats.requests.failed' results.json)" >> $GITHUB_ENV

          echo "ASSERTIONS=$(jq '.run.stats.assertions.total' results.json)" >> $GITHUB_ENV
          echo "FAILED_ASSERTIONS=$(jq '.run.stats.assertions.failed' results.json)" >> $GITHUB_ENV

      - name: Send Slack notification
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          PASSED_ASSERTIONS=$((ASSERTIONS - FAILED_ASSERTIONS))

          if [ "${{ job.status }}" = "success" ]; then
            STATUS_ICON="✅"
          else
            STATUS_ICON="❌"
          fi

          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          MESSAGE=$(cat <<EOF
          ${STATUS_ICON} *Postman Collection Results*

          📦 *Repository:* ${{ github.repository }}
          🌿 *Branch:* ${{ github.ref_name }}

          📨 *Requests Executed:* ${REQUESTS}
          ⚠️ *Failed Requests:* ${FAILED_REQUESTS}

          🧪 *Assertions:* ${ASSERTIONS}
          ✅ *Passed Assertions:* ${PASSED_ASSERTIONS}
          ❌ *Failed Assertions:* ${FAILED_ASSERTIONS}

          🚦 *Status:* ${{ job.status }}

          🔗 *GitHub Run:*
          ${RUN_URL}
          EOF
          )

          jq -n --arg text "$MESSAGE" '{text: $text}' > payload.json

          curl -X POST \
            -H "Content-type: application/json" \
            --data @payload.json \
            "$SLACK_WEBHOOK_URL"
